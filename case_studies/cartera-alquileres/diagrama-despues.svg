<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="800" height="440" role="img" aria-label="La inmobiliaria le reenvía archivos a Olmo. El agente los guarda donde corresponde en una carpeta ordenada por propiedad, la lee, y responde al dueño, al socio y a la contadora citando la fuente de cada dato. Sobre la planilla escribe celdas de datos, nunca fórmulas." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      .lbl  { font-family: 'Nunito', ui-sans-serif, system-ui, sans-serif; font-size: 14px; font-weight: 700; fill: #1E2327; }
      .sub  { font-family: 'Nunito', ui-sans-serif, system-ui, sans-serif; font-size: 11px; font-weight: 400; fill: #7A828C; }
      .cap  { font-family: 'Nunito', ui-sans-serif, system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: #7A828C; }
      .kick { font-family: 'Nunito', ui-sans-serif, system-ui, sans-serif; font-size: 12px; font-weight: 800; fill: #C8912A; letter-spacing: 2px; }
      .flow { font-family: 'Nunito', ui-sans-serif, system-ui, sans-serif; font-size: 11px; font-weight: 700; fill: #7A828C; }
      .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11.5px; fill: #3C444D; }
      .monoh{ font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; font-weight: 700; fill: #1E2327; }
      .card { fill: #FFFFFF; stroke: #DCE0E5; stroke-width: 1.5; }
      .arw  { stroke: #B9BFC7; stroke-width: 1.8; fill: none; marker-end: url(#ah); }
    </style>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#B9BFC7"/>
    </marker>
  </defs>

  <rect width="800" height="440" fill="#FFFFFF"/>
  <text x="28" y="34" class="kick">DESPUÉS</text>

  <!-- la inmobiliaria le manda archivos al agente -->
  <rect x="300" y="52" width="210" height="46" rx="10" class="card"/>
  <text x="405" y="72" text-anchor="middle" class="lbl">Inmobiliaria</text>
  <text x="405" y="88" text-anchor="middle" class="sub">liquidaciones y contratos nuevos</text>
  <path class="arw" d="M405 102 L405 158"/>
  <text x="416" y="134" class="flow">reenvía archivos</text>

  <!-- repositorio de documentos -->
  <rect x="28" y="120" width="230" height="250" rx="12" fill="#FBFBFC" stroke="#DCE0E5" stroke-width="1.5"/>
  <g fill="#C8912A">
    <path d="M44 137 h7 l2.5 3.5 h8.5 a2 2 0 0 1 2 2 v10 a2 2 0 0 1 -2 2 h-18 a2 2 0 0 1 -2 -2 v-13.5 a2 2 0 0 1 2 -2 z"/>
  </g>
  <text x="72" y="150" class="monoh">propiedades/</text>
  <text x="44" y="176" class="mono">duplex-centro/</text>
  <text x="56" y="198" class="mono">contrato-2023.pdf</text>
  <text x="56" y="220" class="mono">escritura.pdf</text>
  <text x="56" y="242" class="mono">recibos/</text>
  <text x="56" y="264" class="mono">liquidaciones/</text>
  <text x="56" y="286" class="mono">CLAUDE.md</text>
  <text x="44" y="310" class="mono">dos-ambientes/</text>
  <text x="44" y="332" class="mono">local/</text>
  <text x="44" y="356" class="sub">PDF con texto · notas humanas por propiedad</text>

  <!-- agente -->
  <rect x="322" y="164" width="166" height="112" rx="14" fill="#FFFFFF" stroke="#E8B54B" stroke-width="2"/>
  <text x="405" y="200" text-anchor="middle" class="lbl" style="font-size:20px; font-weight:800">Olmo</text>
  <text x="405" y="222" text-anchor="middle" class="sub">lee, calcula fechas y plata</text>
  <rect x="336" y="238" width="138" height="24" rx="12" fill="#FDF7EA" stroke="#E8B54B" stroke-width="1.2"/>
  <text x="405" y="254" text-anchor="middle" class="flow" style="fill:#C8912A">permisos acotados</text>

  <path class="arw" d="M262 205 L316 198"/>
  <text x="289" y="190" text-anchor="middle" class="flow">lee</text>
  <path class="arw" d="M320 244 L262 252"/>
  <text x="289" y="270" text-anchor="middle" class="flow">ordena</text>

  <!-- personas -->
  <text x="656" y="98" text-anchor="middle" class="flow">cada respuesta cita el documento</text>
  <rect x="540" y="112" width="232" height="52" rx="10" class="card"/>
  <text x="656" y="135" text-anchor="middle" class="lbl">Dueño</text>
  <text x="656" y="152" text-anchor="middle" class="sub">¿cuándo ajusta el dúplex?</text>

  <rect x="540" y="188" width="232" height="52" rx="10" class="card"/>
  <text x="656" y="211" text-anchor="middle" class="lbl">Socio</text>
  <text x="656" y="228" text-anchor="middle" class="sub">¿cuánto me corresponde?</text>

  <rect x="540" y="264" width="232" height="52" rx="10" class="card"/>
  <text x="656" y="287" text-anchor="middle" class="lbl">Contadora</text>
  <text x="656" y="304" text-anchor="middle" class="sub">¿qué facturo este mes?</text>

  <path class="arw" d="M494 208 C 516 208, 518 138, 534 138"/>
  <path class="arw" d="M494 218 L534 216"/>
  <path class="arw" d="M494 232 C 516 232, 518 290, 534 290"/>

  <!-- planilla -->
  <rect x="322" y="330" width="166" height="52" rx="10" class="card"/>
  <text x="405" y="353" text-anchor="middle" class="lbl">Planilla de cuentas</text>
  <text x="405" y="370" text-anchor="middle" class="sub">celdas, nunca fórmulas</text>
  <path class="arw" d="M405 282 L405 324"/>
  <text x="418" y="308" class="flow">escribe datos</text>

  <text x="400" y="416" text-anchor="middle" class="cap">La inmobiliaria manda los archivos, Olmo los guarda donde corresponde y contesta citando la fuente.</text>
</svg>
