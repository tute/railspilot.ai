<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="800" height="440" role="img" aria-label="La información repartida entre la inmobiliaria, la escribanía, la contadora, audios de WhatsApp, fotos de recibos y el cajón de contratos. Ninguna fuente tiene la respuesta completa." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      .lbl   { font-family: 'Nunito', ui-sans-serif, system-ui, sans-serif; font-size: 14px; font-weight: 700; fill: #1E2327; }
      .sub   { font-family: 'Nunito', ui-sans-serif, system-ui, sans-serif; font-size: 11px; font-weight: 400; fill: #7A828C; }
      .ask   { font-family: 'Nunito', ui-sans-serif, system-ui, sans-serif; font-size: 16px; font-weight: 800; fill: #1E2327; }
      .cap   { font-family: 'Nunito', ui-sans-serif, system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: #7A828C; }
      .kick  { font-family: 'Nunito', ui-sans-serif, system-ui, sans-serif; font-size: 12px; font-weight: 800; fill: #C8912A; letter-spacing: 2px; }
      .card  { fill: #FFFFFF; stroke: #DCE0E5; stroke-width: 1.5; }
      .brk   { stroke: #C2554A; stroke-width: 1.6; stroke-dasharray: 5 6; opacity: .6; fill: none; }
      .x     { stroke: #C2554A; stroke-width: 2; opacity: .75; stroke-linecap: round; }
    </style>
  </defs>

  <rect width="800" height="440" fill="#FFFFFF"/>
  <text x="28" y="42" class="kick">ANTES</text>

  <!-- pregunta central -->
  <rect x="270" y="200" width="260" height="76" rx="14" fill="#FDF7EA" stroke="#E8B54B" stroke-width="2"/>
  <text x="400" y="234" text-anchor="middle" class="ask">¿De cuánto es el alquiler</text>
  <text x="400" y="256" text-anchor="middle" class="ask">de este mes?</text>

  <!-- fuentes dispersas -->
  <g transform="rotate(-3 124 86)">
    <rect x="40" y="60" width="168" height="52" rx="10" class="card"/>
    <text x="124" y="83" text-anchor="middle" class="lbl">Inmobiliaria</text>
    <text x="124" y="100" text-anchor="middle" class="sub">liquidaciones sueltas</text>
  </g>
  <g transform="rotate(2 334 56)">
    <rect x="250" y="30" width="168" height="52" rx="10" class="card"/>
    <text x="334" y="53" text-anchor="middle" class="lbl">Escribanía</text>
    <text x="334" y="70" text-anchor="middle" class="sub">escrituras y boletos</text>
  </g>
  <g transform="rotate(-2 554 88)">
    <rect x="470" y="62" width="168" height="52" rx="10" class="card"/>
    <text x="554" y="85" text-anchor="middle" class="lbl">Contadora</text>
    <text x="554" y="102" text-anchor="middle" class="sub">necesita el monto para facturar</text>
  </g>
  <g transform="rotate(3 684 206)">
    <rect x="600" y="180" width="168" height="52" rx="10" class="card"/>
    <text x="684" y="203" text-anchor="middle" class="lbl">Audios de WhatsApp</text>
    <text x="684" y="220" text-anchor="middle" class="sub">"quedamos en 10%"</text>
  </g>
  <g transform="rotate(-3 644 346)">
    <rect x="560" y="320" width="168" height="52" rx="10" class="card"/>
    <text x="644" y="343" text-anchor="middle" class="lbl">Fotos de recibos</text>
    <text x="644" y="360" text-anchor="middle" class="sub">una foto por pago, sin ordenar</text>
  </g>
  <g transform="rotate(-2 144 326)">
    <rect x="60" y="300" width="168" height="52" rx="10" class="card"/>
    <text x="144" y="323" text-anchor="middle" class="lbl">El cajón de contratos</text>
    <text x="144" y="340" text-anchor="middle" class="sub">siete páginas cada uno</text>
  </g>

  <!-- conexiones que no llegan -->
  <path class="brk" d="M207 132 L290 177"/>
  <g class="x" transform="translate(290 177)"><line x1="-5" y1="-5" x2="5" y2="5"/><line x1="5" y1="-5" x2="-5" y2="5"/></g>

  <path class="brk" d="M354 111 L374 165"/>
  <g class="x" transform="translate(374 165)"><line x1="-5" y1="-5" x2="5" y2="5"/><line x1="5" y1="-5" x2="-5" y2="5"/></g>

  <path class="brk" d="M508 133 L462 178"/>
  <g class="x" transform="translate(462 178)"><line x1="-5" y1="-5" x2="5" y2="5"/><line x1="5" y1="-5" x2="-5" y2="5"/></g>

  <path class="brk" d="M599 216 L560 221"/>
  <g class="x" transform="translate(560 221)"><line x1="-5" y1="-5" x2="5" y2="5"/><line x1="5" y1="-5" x2="-5" y2="5"/></g>

  <path class="brk" d="M571 314 L512 287"/>
  <g class="x" transform="translate(512 287)"><line x1="-5" y1="-5" x2="5" y2="5"/><line x1="5" y1="-5" x2="-5" y2="5"/></g>

  <path class="brk" d="M221 300 L282 281"/>
  <g class="x" transform="translate(282 281)"><line x1="-5" y1="-5" x2="5" y2="5"/><line x1="5" y1="-5" x2="-5" y2="5"/></g>

  <text x="400" y="430" text-anchor="middle" class="cap">Seis fuentes, ninguna completa. La respuesta se reconstruye a mano cada mes.</text>
</svg>
