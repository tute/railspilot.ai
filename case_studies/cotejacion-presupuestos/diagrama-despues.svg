<svg viewBox="0 0 800 520" xmlns="http://www.w3.org/2000/svg" font-family="Inter, Arial, sans-serif">
  <!-- Background -->
  <rect width="800" height="520" fill="#FAFAFA" rx="8"/>

  <!-- Source documents -->
  <rect x="30" y="65" width="90" height="90" rx="4" fill="#FFF" stroke="#E53E3E" stroke-width="1.5"/>
  <rect x="30" y="65" width="90" height="24" rx="4" fill="#E53E3E"/>
  <text x="75" y="82" text-anchor="middle" font-size="12" fill="#FFF" font-weight="600">PDF</text>
  <text x="75" y="106" text-anchor="middle" font-size="10" fill="#999">Proveedor A</text>
  <line x1="42" y1="118" x2="108" y2="118" stroke="#DDD" stroke-width="0.5"/>
  <line x1="42" y1="128" x2="100" y2="128" stroke="#DDD" stroke-width="0.5"/>
  <line x1="42" y1="138" x2="108" y2="138" stroke="#DDD" stroke-width="0.5"/>

  <rect x="140" y="65" width="90" height="90" rx="4" fill="#FFF" stroke="#3182CE" stroke-width="1.5"/>
  <rect x="140" y="65" width="90" height="24" rx="4" fill="#3182CE"/>
  <text x="185" y="82" text-anchor="middle" font-size="12" fill="#FFF" font-weight="600">Mail</text>
  <text x="185" y="106" text-anchor="middle" font-size="10" fill="#999">Proveedor B</text>
  <text x="152" y="120" font-size="8" fill="#AAA">Estimados...</text>
  <text x="152" y="132" font-size="8" fill="#AAA">adjuntamos...</text>

  <rect x="250" y="65" width="90" height="90" rx="4" fill="#FFF" stroke="#38A169" stroke-width="1.5"/>
  <rect x="250" y="65" width="90" height="24" rx="4" fill="#38A169"/>
  <text x="295" y="82" text-anchor="middle" font-size="12" fill="#FFF" font-weight="600">Planilla</text>
  <text x="295" y="106" text-anchor="middle" font-size="10" fill="#999">Proveedor C</text>
  <line x1="262" y1="116" x2="328" y2="116" stroke="#DDD" stroke-width="0.5"/>
  <line x1="262" y1="126" x2="328" y2="126" stroke="#DDD" stroke-width="0.5"/>
  <line x1="262" y1="136" x2="328" y2="136" stroke="#DDD" stroke-width="0.5"/>
  <line x1="283" y1="102" x2="283" y2="150" stroke="#DDD" stroke-width="0.5"/>
  <line x1="307" y1="102" x2="307" y2="150" stroke="#DDD" stroke-width="0.5"/>

  <rect x="360" y="65" width="90" height="90" rx="4" fill="#FFF" stroke="#D69E2E" stroke-width="1.5"/>
  <rect x="360" y="65" width="90" height="24" rx="4" fill="#D69E2E"/>
  <text x="405" y="82" text-anchor="middle" font-size="12" fill="#FFF" font-weight="600">PDF</text>
  <text x="405" y="106" text-anchor="middle" font-size="10" fill="#999">Proveedor D</text>
  <line x1="372" y1="118" x2="438" y2="118" stroke="#DDD" stroke-width="0.5"/>
  <line x1="372" y1="128" x2="430" y2="128" stroke="#DDD" stroke-width="0.5"/>
  <line x1="372" y1="138" x2="438" y2="138" stroke="#DDD" stroke-width="0.5"/>

  <!-- Arrows from docs to robot -->
  <defs>
    <marker id="arrowG" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#667EEA"/>
    </marker>
    <marker id="arrowDown" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#667EEA"/>
    </marker>
  </defs>

  <line x1="75" y1="157" x2="222" y2="185" stroke="#667EEA" stroke-width="1.5" marker-end="url(#arrowG)"/>
  <line x1="185" y1="157" x2="228" y2="185" stroke="#667EEA" stroke-width="1.5" marker-end="url(#arrowG)"/>
  <line x1="295" y1="157" x2="248" y2="185" stroke="#667EEA" stroke-width="1.5" marker-end="url(#arrowG)"/>
  <line x1="405" y1="157" x2="258" y2="185" stroke="#667EEA" stroke-width="1.5" marker-end="url(#arrowG)"/>

  <!-- Robot icon at convergence point -->
  <g transform="translate(240, 200)">
    <rect x="-18" y="-12" width="36" height="28" rx="6" fill="#667EEA" fill-opacity="0.15" stroke="#667EEA" stroke-width="1.5"/>
    <circle cx="-7" cy="1" r="3.5" fill="#667EEA"/>
    <circle cx="7" cy="1" r="3.5" fill="#667EEA"/>
    <circle cx="-6" cy="0" r="1.2" fill="#FFF"/>
    <circle cx="8" cy="0" r="1.2" fill="#FFF"/>
    <rect x="-8" y="9" width="16" height="2.5" rx="1" fill="#667EEA"/>
    <line x1="0" y1="-12" x2="0" y2="-19" stroke="#667EEA" stroke-width="1.5"/>
    <circle cx="0" cy="-21" r="3" fill="#667EEA"/>
  </g>

  <!-- Arrow from robot to Step 1 -->
  <line x1="240" y1="220" x2="240" y2="238" stroke="#667EEA" stroke-width="1.5" marker-end="url(#arrowDown)"/>

  <!-- Step 1 -->
  <rect x="130" y="243" width="220" height="36" rx="8" fill="#667EEA" fill-opacity="0.1" stroke="#667EEA" stroke-width="1.5"/>
  <text x="240" y="267" text-anchor="middle" font-size="14" font-weight="600" fill="#667EEA">1. Lectura y extracción</text>

  <!-- Arrow -->
  <line x1="240" y1="281" x2="240" y2="296" stroke="#667EEA" stroke-width="1.5" marker-end="url(#arrowDown)"/>

  <!-- Step 2 -->
  <rect x="130" y="301" width="220" height="36" rx="8" fill="#667EEA" fill-opacity="0.15" stroke="#667EEA" stroke-width="1.5"/>
  <text x="240" y="325" text-anchor="middle" font-size="14" font-weight="600" fill="#667EEA">2. Normalización</text>

  <!-- Arrow -->
  <line x1="240" y1="339" x2="240" y2="354" stroke="#667EEA" stroke-width="1.5" marker-end="url(#arrowDown)"/>

  <!-- Step 3 (renamed, two lines) -->
  <rect x="130" y="359" width="220" height="36" rx="8" fill="#667EEA" fill-opacity="0.2" stroke="#667EEA" stroke-width="1.5"/>
  <text x="240" y="382" text-anchor="middle" font-size="14" font-weight="600" fill="#667EEA">3. Planilla</text>

  <!-- Arrow -->
  <line x1="240" y1="398" x2="240" y2="422" stroke="#667EEA" stroke-width="1.5" marker-end="url(#arrowDown)"/>

  <!-- Step 4 (new, two lines) -->
  <rect x="130" y="427" width="220" height="36" rx="8" fill="#667EEA" fill-opacity="0.25" stroke="#667EEA" stroke-width="1.5"/>
  <text x="240" y="450" text-anchor="middle" font-size="13" font-weight="600" fill="#667EEA">4. Borradores 📧</text>

  <!-- Arrow from step 3 to result table -->
  <line x1="350" y1="382" x2="448" y2="340" stroke="#667EEA" stroke-width="2" marker-end="url(#arrowG)"/>

  <!-- Result table (without column D) -->
  <rect x="458" y="170" width="310" height="280" rx="6" fill="#FFF" stroke="#CBD5E0" stroke-width="1.5"/>
  <text x="613" y="197" text-anchor="middle" font-size="15" font-weight="bold" fill="#2D3748">Tabla comparativa</text>

  <!-- Table header -->
  <rect x="468" y="208" width="290" height="26" rx="2" fill="#EBF8FF"/>
  <text x="520" y="226" text-anchor="middle" font-size="11" font-weight="600" fill="#2D3748">Concepto</text>
  <text x="610" y="226" text-anchor="middle" font-size="11" font-weight="600" fill="#E53E3E">A</text>
  <text x="670" y="226" text-anchor="middle" font-size="11" font-weight="600" fill="#3182CE">B</text>
  <text x="730" y="226" text-anchor="middle" font-size="11" font-weight="600" fill="#38A169">C</text>

  <!-- Vertical lines -->
  <line x1="570" y1="208" x2="570" y2="430" stroke="#E2E8F0" stroke-width="0.5"/>
  <line x1="640" y1="208" x2="640" y2="430" stroke="#E2E8F0" stroke-width="0.5"/>
  <line x1="700" y1="208" x2="700" y2="430" stroke="#E2E8F0" stroke-width="0.5"/>

  <!-- Row 1 -->
  <line x1="468" y1="246" x2="758" y2="246" stroke="#EDF2F7" stroke-width="0.5"/>
  <text x="478" y="263" font-size="11" fill="#555">Línea producción</text>
  <text x="610" y="263" text-anchor="middle" font-size="11" fill="#555">$4.2M</text>
  <text x="670" y="263" text-anchor="middle" font-size="11" fill="#555">$4.5M</text>
  <text x="730" y="263" text-anchor="middle" font-size="11" fill="#555">$3.8M</text>

  <!-- Row 2 -->
  <line x1="468" y1="276" x2="758" y2="276" stroke="#EDF2F7" stroke-width="0.5"/>
  <text x="478" y="293" font-size="11" fill="#555">Obra civil</text>
  <text x="610" y="293" text-anchor="middle" font-size="11" fill="#555">Incluido</text>
  <text x="670" y="293" text-anchor="middle" font-size="11" fill="#555">$890K</text>
  <text x="730" y="293" text-anchor="middle" font-size="11" fill="#555">$780K</text>

  <!-- Row 3 -->
  <line x1="468" y1="306" x2="758" y2="306" stroke="#EDF2F7" stroke-width="0.5"/>
  <text x="478" y="323" font-size="11" fill="#555">Fundaciones</text>
  <rect x="583" y="312" width="56" height="16" rx="2" fill="#FEFCBF"/>
  <text x="610" y="324" text-anchor="middle" font-size="9" fill="#975A16">En obra civil</text>
  <text x="670" y="323" text-anchor="middle" font-size="11" fill="#555">$340K</text>
  <text x="730" y="323" text-anchor="middle" font-size="11" fill="#555">$310K</text>

  <!-- Row 4 -->
  <line x1="468" y1="336" x2="758" y2="336" stroke="#EDF2F7" stroke-width="0.5"/>
  <text x="478" y="353" font-size="11" fill="#555">Transporte</text>
  <rect x="583" y="342" width="56" height="16" rx="2" fill="#FEFCBF"/>
  <text x="610" y="354" text-anchor="middle" font-size="9" fill="#975A16">Incluido</text>
  <text x="670" y="353" text-anchor="middle" font-size="11" fill="#555">$120K</text>
  <rect x="703" y="342" width="56" height="16" rx="2" fill="#FEFCBF"/>
  <text x="730" y="354" text-anchor="middle" font-size="9" fill="#975A16">Incluido</text>

  <!-- Row 5 -->
  <line x1="468" y1="366" x2="758" y2="366" stroke="#EDF2F7" stroke-width="0.5"/>
  <text x="478" y="383" font-size="11" fill="#555">Plazo de entrega</text>
  <text x="610" y="383" text-anchor="middle" font-size="11" fill="#555">90 días</text>
  <text x="670" y="383" text-anchor="middle" font-size="11" fill="#555">120 días</text>
  <text x="730" y="383" text-anchor="middle" font-size="11" fill="#555">75 días</text>

  <!-- Row 6 -->
  <line x1="468" y1="396" x2="758" y2="396" stroke="#EDF2F7" stroke-width="0.5"/>
  <text x="478" y="413" font-size="11" fill="#555">Condición de pago</text>
  <text x="610" y="413" text-anchor="middle" font-size="11" fill="#555">50/50</text>
  <text x="670" y="413" text-anchor="middle" font-size="11" fill="#555">30/30/40</text>
  <text x="730" y="413" text-anchor="middle" font-size="11" fill="#555">40/60</text>

  <!-- Total row -->
  <line x1="468" y1="426" x2="758" y2="426" stroke="#CBD5E0" stroke-width="1"/>
  <text x="478" y="445" font-size="12" font-weight="bold" fill="#2D3748">Total</text>
  <text x="610" y="445" text-anchor="middle" font-size="12" font-weight="bold" fill="#555">$4.2M</text>
  <text x="670" y="445" text-anchor="middle" font-size="12" font-weight="bold" fill="#555">$5.85M</text>
  <text x="730" y="445" text-anchor="middle" font-size="12" font-weight="bold" fill="#48BB78">$4.89M</text>

  <!-- Footnote -->
  <text x="478" y="498" font-size="9" fill="#999">Amarillo = incluido en otro rubro.</text>
</svg>
