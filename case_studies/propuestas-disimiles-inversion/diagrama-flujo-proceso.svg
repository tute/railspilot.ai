<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" font-family="system-ui, -apple-system, sans-serif">
  <!-- Background -->
  <rect width="900" height="340" fill="#fafafa" rx="8"/>

  <!-- Title -->
  <text x="450" y="32" text-anchor="middle" font-size="15" font-weight="600" fill="#1a1a1a">De la sobremesa al cuadro comparativo</text>

  <!-- BEFORE zone -->
  <rect x="30" y="55" width="260" height="230" rx="10" fill="#fff3e0" stroke="#ff9800" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="160" y="78" text-anchor="middle" font-size="11" font-weight="600" fill="#e65100" letter-spacing="1">ANTES</text>

  <!-- Conversation bubbles -->
  <rect x="50" y="92" width="170" height="32" rx="12" fill="#ffffff" stroke="#ffb74d" stroke-width="1"/>
  <text x="135" y="113" text-anchor="middle" font-size="10" fill="#5d4037">"Por lo menos 2 millones"</text>

  <rect x="100" y="132" width="175" height="32" rx="12" fill="#ffffff" stroke="#ffb74d" stroke-width="1"/>
  <text x="187" y="153" text-anchor="middle" font-size="10" fill="#5d4037">"El terreno sale 12 mil"</text>

  <rect x="55" y="172" width="195" height="32" rx="12" fill="#ffffff" stroke="#ffb74d" stroke-width="1"/>
  <text x="152" y="193" text-anchor="middle" font-size="10" fill="#5d4037">"Yo conozco uno que hizo..."</text>

  <rect x="80" y="212" width="185" height="32" rx="12" fill="#ffffff" stroke="#ffb74d" stroke-width="1"/>
  <text x="172" y="233" text-anchor="middle" font-size="10" fill="#5d4037">"¿Y si construimos arriba?"</text>

  <text x="160" y="268" text-anchor="middle" font-size="10" fill="#bf360c" font-style="italic">4 opciones, 3 opiniones,</text>
  <text x="160" y="282" text-anchor="middle" font-size="10" fill="#bf360c" font-style="italic">ningún número firme</text>

  <!-- Arrow 1 -->
  <line x1="300" y1="170" x2="345" y2="170" stroke="#9e9e9e" stroke-width="2" marker-end="url(#arrowGray)"/>

  <!-- PROCESS zone -->
  <rect x="355" y="55" width="190" height="230" rx="10" fill="#e3f2fd" stroke="#1976d2" stroke-width="1.5"/>
  <text x="450" y="78" text-anchor="middle" font-size="11" font-weight="600" fill="#0d47a1" letter-spacing="1">PROCESO</text>

  <!-- Steps -->
  <rect x="375" y="92" width="150" height="28" rx="6" fill="#bbdefb"/>
  <text x="450" y="111" text-anchor="middle" font-size="9.5" fill="#0d47a1">Planilla real: 80+ líneas</text>

  <line x1="450" y1="120" x2="450" y2="132" stroke="#90caf9" stroke-width="1.5"/>

  <rect x="375" y="132" width="150" height="28" rx="6" fill="#bbdefb"/>
  <text x="450" y="151" text-anchor="middle" font-size="9.5" fill="#0d47a1">Normativa urbana</text>

  <line x1="450" y1="160" x2="450" y2="172" stroke="#90caf9" stroke-width="1.5"/>

  <rect x="375" y="172" width="150" height="28" rx="6" fill="#bbdefb"/>
  <text x="450" y="191" text-anchor="middle" font-size="9.5" fill="#0d47a1">Costos de referencia</text>

  <line x1="450" y1="200" x2="450" y2="212" stroke="#90caf9" stroke-width="1.5"/>

  <rect x="375" y="212" width="150" height="28" rx="6" fill="#bbdefb"/>
  <text x="450" y="231" text-anchor="middle" font-size="9.5" fill="#0d47a1">Cuestionó supuestos</text>

  <text x="450" y="266" text-anchor="middle" font-size="10" fill="#1565c0" font-style="italic">1 noche + 1-2 hs de chat</text>

  <!-- Arrow 2 -->
  <line x1="555" y1="170" x2="600" y2="170" stroke="#9e9e9e" stroke-width="2" marker-end="url(#arrowGray)"/>

  <!-- AFTER zone -->
  <rect x="610" y="55" width="260" height="230" rx="10" fill="#e8f5e9" stroke="#388e3c" stroke-width="1.5"/>
  <text x="740" y="78" text-anchor="middle" font-size="11" font-weight="600" fill="#1b5e20" letter-spacing="1">DESPUÉS</text>

  <!-- Result items -->
  <rect x="630" y="92" width="220" height="28" rx="6" fill="#c8e6c9"/>
  <text x="740" y="111" text-anchor="middle" font-size="9.5" fill="#1b5e20">4 inversiones comparadas lado a lado</text>

  <rect x="630" y="128" width="220" height="28" rx="6" fill="#c8e6c9"/>
  <text x="740" y="147" text-anchor="middle" font-size="9.5" fill="#1b5e20">Simulador con variables ajustables</text>

  <rect x="630" y="164" width="220" height="28" rx="6" fill="#c8e6c9"/>
  <text x="740" y="183" text-anchor="middle" font-size="9.5" fill="#1b5e20">Supuestos explícitos y cuestionados</text>

  <rect x="630" y="200" width="220" height="28" rx="6" fill="#c8e6c9"/>
  <text x="740" y="219" text-anchor="middle" font-size="9.5" fill="#1b5e20">Preguntas pendientes por negocio</text>

  <rect x="630" y="236" width="220" height="28" rx="6" fill="#66bb6a"/>
  <text x="740" y="255" text-anchor="middle" font-size="10" font-weight="600" fill="#ffffff">Decisión tomada en la semana</text>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9e9e9e"/>
    </marker>
  </defs>

  <!-- Footer -->
  <text x="450" y="320" text-anchor="middle" font-size="9" fill="#9e9e9e">La misma conversación de siempre, pero con un interlocutor que obliga a ser preciso</text>
</svg>
