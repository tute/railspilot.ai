<svg viewBox="0 0 800 540" xmlns="http://www.w3.org/2000/svg" font-family="Inter, Arial, sans-serif">
  <!-- Background -->
  <rect width="800" height="540" fill="#FAFAFA" rx="8"/>

  <!-- Title -->
  <text x="400" y="38" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">Hoy: un profesional en el medio de cada mensaje</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#AAA"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#E53E3E"/>
    </marker>
  </defs>

  <!-- WhatsApp group box -->
  <rect x="40" y="65" width="360" height="230" rx="10" fill="#FFF" stroke="#25D366" stroke-width="1.8"/>
  <rect x="40" y="65" width="360" height="30" rx="10" fill="#25D366"/>
  <text x="220" y="85" text-anchor="middle" font-size="13" fill="#FFF" font-weight="600">Grupo de WhatsApp</text>

  <!-- Parent A -->
  <circle cx="80" cy="130" r="16" fill="#FDE8E8" stroke="#E53E3E" stroke-width="1.5"/>
  <text x="80" y="135" text-anchor="middle" font-size="14">👨</text>
  <text x="80" y="162" text-anchor="middle" font-size="11" fill="#718096">Padre</text>

  <!-- Parent B -->
  <circle cx="360" cy="130" r="16" fill="#E8F0FD" stroke="#3182CE" stroke-width="1.5"/>
  <text x="360" y="135" text-anchor="middle" font-size="14">👩</text>
  <text x="360" y="162" text-anchor="middle" font-size="11" fill="#718096">Madre</text>

  <!-- Hostile bubbles -->
  <rect x="70" y="185" width="150" height="26" rx="8" fill="#FDECEC" stroke="#E53E3E" stroke-width="1"/>
  <text x="82" y="202" font-size="11" fill="#C53030">"Sos un irresponsable 😡"</text>

  <rect x="215" y="219" width="150" height="26" rx="8" fill="#FDECEC" stroke="#E53E3E" stroke-width="1"/>
  <text x="227" y="236" font-size="11" fill="#C53030">"Vos nunca cumplís 🤬"</text>

  <!-- Psychologist as broker in the middle -->
  <circle cx="220" cy="130" r="22" fill="#FFF8F0" stroke="#DD6B20" stroke-width="1.8"/>
  <text x="220" y="137" text-anchor="middle" font-size="18">😓</text>
  <text x="220" y="270" text-anchor="middle" font-size="12" fill="#DD6B20" font-weight="700">Psicóloga (intermediaria)</text>
  <text x="220" y="286" text-anchor="middle" font-size="10" fill="#DD6B20">modera y transcribe en vivo</text>

  <!-- Cost tag -->
  <rect x="435" y="110" width="150" height="46" rx="8" fill="#FFF5F5" stroke="#E53E3E" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="510" y="132" text-anchor="middle" font-size="13" font-weight="700" fill="#E53E3E">$$$ honorarios</text>
  <text x="510" y="148" text-anchor="middle" font-size="10" fill="#E53E3E">altos por mes</text>

  <!-- Arrow from group to report -->
  <line x1="400" y1="210" x2="470" y2="210" stroke="#AAA" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Subjective report -->
  <rect x="480" y="180" width="130" height="70" rx="6" fill="#FFF" stroke="#CBD5E0" stroke-width="1.5"/>
  <text x="545" y="200" text-anchor="middle" font-size="12" font-weight="600" fill="#555">Informe</text>
  <line x1="494" y1="212" x2="596" y2="212" stroke="#EDF2F7" stroke-width="1"/>
  <line x1="494" y1="224" x2="596" y2="224" stroke="#EDF2F7" stroke-width="1"/>
  <line x1="494" y1="236" x2="570" y2="236" stroke="#EDF2F7" stroke-width="1"/>
  <text x="545" y="266" text-anchor="middle" font-size="10" fill="#DD6B20">redactado a mano</text>

  <!-- Down to law firm -->
  <text x="360" y="330" text-anchor="middle" font-size="13" font-weight="600" fill="#555">Estudio jurídico</text>

  <!-- Screenshots -->
  <rect x="120" y="345" width="200" height="90" rx="6" fill="#FFF" stroke="#DD6B20" stroke-width="1.5" stroke-dasharray="6 3"/>
  <text x="220" y="368" text-anchor="middle" font-size="12" font-weight="600" fill="#DD6B20">Capturas de pantalla</text>
  <text x="170" y="402" text-anchor="middle" font-size="20">📷</text>
  <text x="220" y="402" text-anchor="middle" font-size="20">📷</text>
  <text x="270" y="402" text-anchor="middle" font-size="20">📷</text>
  <text x="220" y="424" text-anchor="middle" font-size="10" fill="#DD6B20">recortadas, sin contexto</text>

  <!-- Arrow to judge -->
  <line x1="320" y1="390" x2="410" y2="390" stroke="#AAA" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Judge -->
  <circle cx="470" cy="390" r="26" fill="#F7FAFC" stroke="#718096" stroke-width="1.8"/>
  <text x="470" y="398" text-anchor="middle" font-size="22">⚖️</text>
  <text x="470" y="440" text-anchor="middle" font-size="12" fill="#718096" font-weight="600">Juez</text>

  <!-- Rejected banner -->
  <rect x="540" y="366" width="220" height="48" rx="8" fill="#FFF5F5" stroke="#E53E3E" stroke-width="1.8"/>
  <text x="650" y="388" text-anchor="middle" font-size="13" font-weight="700" fill="#E53E3E">"A veces no lo acepto</text>
  <text x="650" y="405" text-anchor="middle" font-size="13" font-weight="700" fill="#E53E3E">como prueba"</text>
  <line x1="524" y1="390" x2="536" y2="390" stroke="#E53E3E" stroke-width="1.8" marker-end="url(#arrowRed)"/>

  <!-- Bottom friction summary -->
  <rect x="40" y="470" width="720" height="46" rx="8" fill="#FFF8F0" stroke="#DD6B20" stroke-width="1.5" stroke-dasharray="6 3"/>
  <text x="400" y="491" text-anchor="middle" font-size="12" fill="#DD6B20" font-weight="600">Depende de que una persona esté presente, se acuerde de todo y redacte sin sesgo.</text>
  <text x="400" y="508" text-anchor="middle" font-size="12" fill="#DD6B20">Caro, agotador y con prueba que el juez puede rechazar.</text>
</svg>
