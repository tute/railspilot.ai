<svg viewBox="0 0 800 540" xmlns="http://www.w3.org/2000/svg" font-family="Inter, Arial, sans-serif">
  <!-- Background -->
  <rect width="800" height="540" fill="#FAFAFA" rx="8"/>

  <!-- Title -->
  <text x="400" y="38" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">Con Coordinador Parental: el intermediario es el sistema</text>

  <defs>
    <marker id="arrowG" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#667EEA"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#38A169"/>
    </marker>
  </defs>

  <!-- Parent A -->
  <rect x="30" y="90" width="120" height="70" rx="8" fill="#FFF" stroke="#E53E3E" stroke-width="1.5"/>
  <text x="90" y="122" text-anchor="middle" font-size="22">📱</text>
  <text x="90" y="148" text-anchor="middle" font-size="12" fill="#718096">Padre</text>

  <!-- Parent B -->
  <rect x="30" y="330" width="120" height="70" rx="8" fill="#FFF" stroke="#3182CE" stroke-width="1.5"/>
  <text x="90" y="362" text-anchor="middle" font-size="22">📱</text>
  <text x="90" y="388" text-anchor="middle" font-size="12" fill="#718096">Madre</text>

  <!-- Arrows to business number -->
  <line x1="150" y1="125" x2="235" y2="215" stroke="#667EEA" stroke-width="1.5" marker-end="url(#arrowG)"/>
  <line x1="150" y1="365" x2="235" y2="275" stroke="#667EEA" stroke-width="1.5" marker-end="url(#arrowG)"/>
  <text x="150" y="245" text-anchor="middle" font-size="10" fill="#718096">nunca entre sí</text>

  <!-- WhatsApp business number + robot -->
  <rect x="245" y="205" width="150" height="80" rx="10" fill="#EEF0FE" stroke="#667EEA" stroke-width="1.8"/>
  <g transform="translate(320, 232)">
    <rect x="-18" y="-12" width="36" height="28" rx="6" fill="#667EEA" fill-opacity="0.15" stroke="#667EEA" stroke-width="1.5"/>
    <circle cx="-7" cy="1" r="3.5" fill="#667EEA"/>
    <circle cx="7" cy="1" r="3.5" fill="#667EEA"/>
    <circle cx="-6" cy="0" r="1.2" fill="#FFF"/>
    <circle cx="8" cy="0" r="1.2" fill="#FFF"/>
    <rect x="-8" y="9" width="16" height="2.5" rx="1" fill="#667EEA"/>
    <line x1="0" y1="-12" x2="0" y2="-19" stroke="#667EEA" stroke-width="1.5"/>
    <circle cx="0" cy="-21" r="3" fill="#667EEA"/>
  </g>
  <text x="320" y="272" text-anchor="middle" font-size="11" fill="#667EEA" font-weight="700">Número de WhatsApp Business</text>

  <!-- Pipeline steps -->
  <line x1="395" y1="245" x2="440" y2="245" stroke="#667EEA" stroke-width="1.5" marker-end="url(#arrowG)"/>

  <rect x="445" y="150" width="230" height="34" rx="8" fill="#667EEA" fill-opacity="0.1" stroke="#667EEA" stroke-width="1.5"/>
  <text x="560" y="172" text-anchor="middle" font-size="13" font-weight="600" fill="#667EEA">1. Clasifica el tono (IA)</text>

  <rect x="445" y="192" width="230" height="34" rx="8" fill="#667EEA" fill-opacity="0.15" stroke="#667EEA" stroke-width="1.5"/>
  <text x="560" y="214" text-anchor="middle" font-size="12" font-weight="600" fill="#667EEA">2. Hostil → pide reformular ✍️</text>

  <rect x="445" y="234" width="230" height="34" rx="8" fill="#667EEA" fill-opacity="0.2" stroke="#667EEA" stroke-width="1.5"/>
  <text x="560" y="256" text-anchor="middle" font-size="12" font-weight="600" fill="#667EEA">3. Neutral → entrega al otro</text>

  <rect x="445" y="276" width="230" height="34" rx="8" fill="#667EEA" fill-opacity="0.25" stroke="#667EEA" stroke-width="1.5"/>
  <text x="560" y="298" text-anchor="middle" font-size="12" font-weight="600" fill="#667EEA">4. Registra todo en el acta</text>

  <!-- Rewrite loop back to sender -->
  <path d="M 445 209 C 410 209, 400 150, 320 205" fill="none" stroke="#667EEA" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#arrowG)"/>

  <!-- Ledger / dashboard -->
  <rect x="245" y="340" width="200" height="120" rx="8" fill="#FFF" stroke="#CBD5E0" stroke-width="1.5"/>
  <text x="345" y="363" text-anchor="middle" font-size="13" font-weight="bold" fill="#2D3748">Panel web del abogado</text>
  <rect x="260" y="374" width="170" height="18" rx="3" fill="#F0FFF4"/>
  <text x="268" y="387" font-size="9" fill="#38A169">✓ entregado · 10:14</text>
  <rect x="260" y="396" width="170" height="18" rx="3" fill="#FFFAF0"/>
  <text x="268" y="409" font-size="9" fill="#DD6B20">↺ reformulado · 10:22</text>
  <rect x="260" y="418" width="170" height="18" rx="3" fill="#F0FFF4"/>
  <text x="268" y="431" font-size="9" fill="#38A169">✓ entregado · 10:23</text>
  <text x="345" y="452" text-anchor="middle" font-size="9" fill="#999">registro completo y con fecha</text>

  <!-- Arrow from pipeline to ledger -->
  <line x1="500" y1="310" x2="420" y2="338" stroke="#667EEA" stroke-width="1.5" marker-end="url(#arrowG)"/>

  <!-- Arrow to PDF -->
  <line x1="445" y1="400" x2="500" y2="400" stroke="#38A169" stroke-width="1.8" marker-end="url(#arrowGreen)"/>

  <!-- Signed PDF -->
  <rect x="510" y="352" width="110" height="96" rx="6" fill="#FFF" stroke="#38A169" stroke-width="1.8"/>
  <rect x="510" y="352" width="110" height="24" rx="6" fill="#38A169"/>
  <text x="565" y="369" text-anchor="middle" font-size="12" fill="#FFF" font-weight="600">PDF firmado</text>
  <line x1="524" y1="392" x2="606" y2="392" stroke="#E2E8F0" stroke-width="1"/>
  <line x1="524" y1="404" x2="606" y2="404" stroke="#E2E8F0" stroke-width="1"/>
  <line x1="524" y1="416" x2="580" y2="416" stroke="#E2E8F0" stroke-width="1"/>
  <text x="565" y="440" text-anchor="middle" font-size="16">🔏</text>

  <!-- Arrow to judge -->
  <line x1="620" y1="400" x2="672" y2="400" stroke="#38A169" stroke-width="1.8" marker-end="url(#arrowGreen)"/>

  <!-- Judge accepts -->
  <circle cx="710" cy="400" r="26" fill="#F0FFF4" stroke="#38A169" stroke-width="1.8"/>
  <text x="710" y="408" text-anchor="middle" font-size="22">⚖️</text>
  <text x="710" y="446" text-anchor="middle" font-size="11" fill="#38A169" font-weight="700">el juez acepta</text>

  <!-- Bottom summary -->
  <rect x="30" y="482" width="740" height="42" rx="8" fill="#F0FFF4" stroke="#38A169" stroke-width="1.5"/>
  <text x="400" y="502" text-anchor="middle" font-size="12" fill="#276749" font-weight="600">Sin una persona relatando cada mensaje. El sistema modera, entrega y deja un acta con fecha</text>
  <text x="400" y="518" text-anchor="middle" font-size="12" fill="#276749">que el estudio revisa en la web y descarga firmada, lista para presentar.</text>
</svg>
